                // Decay screen shake
                if (this.screenShake.duration > 0) {
                    this.screenShake.x = (Math.random() - 0.5) * this.screenShake.intensity;
                    this.screenShake.y = (Math.random() - 0.5) * this.screenShake.intensity;
                    this.screenShake.duration--;
                    this.screenShake.intensity *= 0.85;
                } else {
                    this.screenShake.x = 0;
                    this.screenShake.y = 0;
                }

                // Update floating numbers
                for (let i = this.floatingNumbers.length - 1; i >= 0; i--) {
                    this.floatingNumbers[i].y -= this.floatingNumbers[i].combo ? 0.6 : 1.5;
                    this.floatingNumbers[i].life++;
                    if (this.floatingNumbers[i].life >= this.floatingNumbers[i].maxLife) {
                        this.floatingNumbers.splice(i, 1);
                    }
                }

                // Decay hit flash
                if (this.player.hitFlash > 0) this.player.hitFlash--;
                if (this.ai.hitFlash > 0) this.ai.hitFlash--;
                if (this.playerHurtFrames > 0) this.playerHurtFrames--;
                if (this.perfectTimer > 0) this.perfectTimer--;
                if (this.koTextTimer > 0) this.koTextTimer--;
                if (this.newHiScoreFlashTimer > 0) this.newHiScoreFlashTimer--;

                // KO fall animation — tip the defeated character from vertical to flat on the ground
                if (this.koCharacter && this.koAngle < Math.PI / 2) {
                    this.koAngle = Math.min(Math.PI / 2, this.koAngle + 0.07);
                    if (!this.koDustSpawned && this.koAngle >= Math.PI / 2) {
                        this.koDustSpawned = true;
                        const px = this.koCharacter.x + this.koCharacter.width / 2;
                        const py = this.koCharacter.y + this.koCharacter.height;
                        const dustColors = ['#c8a96e', '#b8976a', '#d4b483'];
                        for (let i = 0; i < 14; i++) {
                            const a = -Math.PI + Math.random() * Math.PI;
                            const spd = 0.8 + Math.random() * 2.5;
                            this.particles.push({
                                x: px + (Math.random() - 0.5) * 40,
                                y: py,
                                vx: Math.cos(a) * spd,
                                vy: Math.sin(a) * spd - 0.8,
                                life: 0,
                                maxLife: 22 + Math.random() * 16,
                                size: 1.8 + Math.random() * 2.5,
                                color: dustColors[Math.floor(Math.random() * dustColors.length)]
                            });
                        }
                        this.triggerScreenShake(3, 5);
                        this.sounds.playKOThud();
                    }
                }

                // Low-health heartbeat pulse — beats faster when critically low
                if (this.player.health > 0 && this.player.health < 30) {
                    const beatRate = this.player.health < 15 ? 28 : 48;
                    this.lowHealthPulse = (this.lowHealthPulse + 1) % beatRate;
                    if (this.lowHealthPulse === 0) this.sounds.playHeartbeat();
                } else {
                    this.lowHealthPulse = 0;
                }
            }

            draw() {
                // Clear canvas with terrible background
                this.ctx.fillStyle = '#87ceeb';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.drawBackground();

                // Apply screen shake
                this.ctx.save();
                this.ctx.translate(this.screenShake.x, this.screenShake.y);
                
                // Terrible ground
                this.ctx.fillStyle = '#90ee90';
                this.ctx.strokeStyle = '#000';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.canvas.height - 20);
                for (let x = 0; x <= this.canvas.width; x += 50) {
                    this.ctx.lineTo(x, this.canvas.height - 20 + Math.sin(x * 0.02) * 5);
                }
                this.ctx.lineTo(this.canvas.width, this.canvas.height);
                this.ctx.lineTo(0, this.canvas.height);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                
                // Draw splats
                this.splats.forEach(splat => this.drawSplat(splat));

                // Draw impact particles
                this.particles.forEach(p => {
                    const alpha = 1 - p.life / p.maxLife;
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha;
                    if (p.confetti) {
                        this.ctx.translate(p.x, p.y);
                        this.ctx.rotate(p.rotation || 0);
                        this.ctx.fillStyle = p.color;
                        this.ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
                    } else {
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size * (0.4 + alpha * 0.6), 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    this.ctx.restore();
                });

                // Power charge aura — glows behind the player while charging
                if (this.charging && this.power > 3) {
                    const power = this.power / 100;
                    const cx = this.player.x + this.player.width / 2;
                    const cy = this.player.y + this.player.height / 2;
                    const maxR = 75 + power * 20;
                    const r = maxR * power;
                    const rgb = this.fKeyPressed ? '100, 210, 80' : '60, 210, 210';
                    const outerAlpha = (0.55 * power).toFixed(3);
                    const midAlpha = (0.22 * power).toFixed(3);
                    this.ctx.save();
                    const grad = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                    grad.addColorStop(0, `rgba(${rgb}, ${outerAlpha})`);
                    grad.addColorStop(0.55, `rgba(${rgb}, ${midAlpha})`);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    this.ctx.fillStyle = grad;
                    this.ctx.beginPath();
                    this.ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }

                // Draw characters
                this.drawCharacter(this.player, true);
                this.drawCharacter(this.ai, false);
                
                // Draw projectiles
                this.projectiles.forEach(projectile => this.drawProjectile(projectile));
                
                // Draw floating damage numbers
                this.floatingNumbers.forEach(n => {
                    const alpha = 1 - n.life / n.maxLife;
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha;
                    this.ctx.textAlign = 'center';
                    this.ctx.strokeStyle = '#000';
                    if (n.combo) {
                        const comboColors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#ff9f43'];
                        const bounce = 1.45 + Math.sin(n.life * 0.28) * 0.12;
                        this.ctx.font = `bold ${Math.round(32 * bounce)}px monospace`;
                        this.ctx.fillStyle = comboColors[(n.combo - 2) % comboColors.length];
                        this.ctx.lineWidth = 4;
                    } else {
                        const scale = 1 + (1 - n.life / n.maxLife) * 0.4;
                        this.ctx.font = `bold ${Math.round(20 * scale)}px monospace`;
                        this.ctx.fillStyle = typeof n.value === 'string' ? '#ffd700' : '#ff3333';
                        this.ctx.lineWidth = 3;
                    }
                    const text = typeof n.value === 'string' ? n.value : '-' + n.value;
                    this.ctx.strokeText(text, n.x, n.y);
                    this.ctx.fillText(text, n.x, n.y);
                    this.ctx.restore();
                });

                this.ctx.restore(); // end screen shake translate

                // Kill flash — brief white screen bloom on the killing blow
                if (this.killFlashTimer > 0) {
                    this.ctx.save();
                    this.ctx.globalAlpha = this.killFlashTimer / 12;
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.restore();
                    this.killFlashTimer--;
                }

                // PERFECT round splash — pulsing purple banner when player wins untouched
                if (this.perfectTimer > 0) {
                    const pFade = Math.min(1, (this.perfectTimer / 50) * 2.5);
                    const pBounce = 1 + Math.sin(Date.now() * 0.018) * 0.07;
                    this.ctx.save();
                    this.ctx.globalAlpha = pFade;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.font = `bold ${Math.round(72 * pBounce)}px monospace`;
                    this.ctx.lineWidth = 11;
                    this.ctx.strokeStyle = '#5f27cd';
                    this.ctx.strokeText('PERFECT!', this.canvas.width / 2, this.canvas.height * 0.4);
                    this.ctx.fillStyle = '#e056fd';
                    this.ctx.fillText('PERFECT!', this.canvas.width / 2, this.canvas.height * 0.4);
                    this.ctx.restore();
                }

                // New hi-score mid-game flash — punch-in gold banner when score first beats personal best
                if (this.newHiScoreFlashTimer > 0) {
                    const elapsed = 160 - this.newHiScoreFlashTimer;
                    const fadeOut = Math.min(1, this.newHiScoreFlashTimer / 22);
                    const fadeIn = Math.min(1, elapsed / 4);
                    const alpha = fadeIn * fadeOut;
                    const overshoot = elapsed < 9 ? 1 + (1 - elapsed / 9) * 0.55 : 1.0;
                    const shimmer = 1 + Math.sin(Date.now() * 0.022) * 0.04;
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha * 0.88;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    const fontSize = Math.round(64 * overshoot * shimmer);
                    this.ctx.font = `bold ${fontSize}px monospace`;
                    this.ctx.lineWidth = 11;
                    this.ctx.strokeStyle = '#5f27cd';
                    this.ctx.strokeText('★ NEW RECORD! ★', this.canvas.width / 2, this.canvas.height * 0.3);
                    this.ctx.fillStyle = '#ffd700';
                    this.ctx.fillText('★ NEW RECORD! ★', this.canvas.width / 2, this.canvas.height * 0.3);
                    this.ctx.restore();
                }

                // Damage vignette — red edge pulse when the player takes a hit
                if (this.playerHurtFrames > 0) {
                    const alpha = (this.playerHurtFrames / 40) * 0.6;
                    const cx = this.canvas.width / 2, cy = this.canvas.height / 2;
                    const grad = this.ctx.createRadialGradient(cx, cy, this.canvas.height * 0.2, cx, cy, this.canvas.height * 0.9);
                    grad.addColorStop(0, 'rgba(200, 0, 0, 0)');
                    grad.addColorStop(1, `rgba(200, 0, 0, ${alpha})`);
                    this.ctx.fillStyle = grad;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                // Low-health heartbeat vignette (pulsing red border, layered under the hit vignette)
                if (this.player.health > 0 && this.player.health < 30) {
                    const beatRate = this.player.health < 15 ? 28 : 48;
                    const phase = this.lowHealthPulse / beatRate;
                    const alpha = Math.pow(Math.sin(phase * Math.PI), 2) * 0.30;
                    if (alpha > 0.004) {
                        const cx = this.canvas.width / 2, cy = this.canvas.height / 2;
                        const grad = this.ctx.createRadialGradient(cx, cy, this.canvas.height * 0.18, cx, cy, this.canvas.height * 0.88);
                        grad.addColorStop(0, 'rgba(180, 0, 0, 0)');
                        grad.addColorStop(1, `rgba(180, 0, 0, ${alpha})`);
                        this.ctx.fillStyle = grad;
                        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    }
                }

                // Persistent combo badge (below DOM HUD, above crosshair)
                if (this.playerCombo >= 2) {
                    const comboColors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#ff9f43'];
                    const pulse = 1 + Math.sin(Date.now() * 0.012) * 0.06;
                    this.ctx.save();
                    this.ctx.textAlign = 'center';
                    this.ctx.font = `bold ${Math.round(17 * pulse)}px monospace`;
                    this.ctx.fillStyle = comboColors[(this.playerCombo - 2) % comboColors.length];
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 3;
                    this.ctx.globalAlpha = 0.92;
                    const badge = `x${this.playerCombo} COMBO`;
                    this.ctx.strokeText(badge, this.canvas.width / 2, 108);
                    this.ctx.fillText(badge, this.canvas.width / 2, 108);
                    this.ctx.restore();
                }

                // Spinach trajectory arc preview while charging (gravity physics makes aiming non-trivial)
                if (this.charging && !this.fKeyPressed) {
                    const power = this.power / 100;
                    const baseSpeed = 4 + power * 6;
                    const startX = this.player.x + this.player.width / 2;
                    const startY = this.player.y + this.player.height / 2;
                    const dx = this.mouse.x - startX;
                    const dy = this.mouse.y - startY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        let px = startX, py = startY;
                        let pvx = (dx / dist) * baseSpeed;
                        let pvy = (dy / dist) * baseSpeed;
                        this.ctx.save();
                        this.ctx.fillStyle = '#55ee88';
                        this.ctx.strokeStyle = '#55ee88';
                        for (let step = 0; step < 140; step++) {
                            px += pvx;
                            py += pvy;
                            pvy += 0.2; // same gravity as real spinach
                            if (px < 0 || px > this.canvas.width || py > this.canvas.height) break;
                            if (step % 4 === 0) {
                                this.ctx.globalAlpha = Math.max(0.08, 0.65 - (step / 140) * 0.57);
                                const r = 2.5 + (step / 140) * 1.5;
                                this.ctx.beginPath();
                                this.ctx.arc(px, py, r, 0, Math.PI * 2);
                                this.ctx.fill();
                            }
                        }
                        this.ctx.restore();
                    }
                }

                // Frog trajectory preview while charging with F held — simulates hop physics and wall bounces
                if (this.charging && this.fKeyPressed) {
                    const power = this.power / 100;
                    const baseSpeed = 5 + power * 5;
                    const startX = this.player.x + this.player.width / 2;
                    const startY = this.player.y + this.player.height / 2;
                    const dx = this.mouse.x - startX;
                    const dy = this.mouse.y - startY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        let px = startX, py = startY;
                        let pvx = (dx / dist) * baseSpeed;
                        let pvy = (dy / dist) * baseSpeed;
                        let hopPhase = 0;
                        let wallBounces = 0;
                        this.ctx.save();
                        this.ctx.fillStyle = '#90ee90';
                        for (let step = 0; step < 120; step++) {
                            hopPhase += 0.28;
                            pvy += Math.sin(hopPhase) * 0.45;
                            px += pvx;
                            py += pvy;
                            if (wallBounces < 2) {
                                if (px <= 8 && pvx < 0) {
                                    px = 8; pvx = Math.abs(pvx) * 0.72; wallBounces++;
                                } else if (px >= this.canvas.width - 8 && pvx > 0) {
                                    px = this.canvas.width - 8; pvx = -Math.abs(pvx) * 0.72; wallBounces++;
                                }
                            }
                            if (py > this.canvas.height) break;
                            if (step % 4 === 0) {
                                this.ctx.globalAlpha = Math.max(0.08, 0.60 - (step / 120) * 0.52);
                                this.ctx.beginPath();
                                this.ctx.arc(px, py, 2 + (step / 120) * 2, 0, Math.PI * 2);
                                this.ctx.fill();
                            }
                        }
                        this.ctx.restore();
                    }
                }

                // Draw crosshair (outside shake so it stays stable)
                if (!this.charging) {
                    this.ctx.strokeStyle = this.fKeyPressed ? '#ff6b6b' : '#4ecdc4';
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.mouse.x - 10, this.mouse.y);
                    this.ctx.lineTo(this.mouse.x + 10, this.mouse.y);
                    this.ctx.moveTo(this.mouse.x, this.mouse.y - 10);
                    this.ctx.lineTo(this.mouse.x, this.mouse.y + 10);
                    this.ctx.stroke();
                }

                // Round-end K.O. / loss announcement — fighting-game punch-in overlay
                if (this.koTextTimer > 0) {
                    const maxTimer = this.koWinner === 'player' ? 44 : 30;
                    const elapsed = maxTimer - this.koTextTimer;
                    const alpha = Math.min(1, this.koTextTimer / 8);
                    const overshoot = elapsed < 8 ? 1 + (1 - elapsed / 8) * 0.65 : 1.0;
                    const text = this.koWinner === 'player' ? 'K.O.!' : "STENCH'D!";
                    const fillColor = this.koWinner === 'player' ? '#ffd700' : '#ff4455';
                    this.ctx.save();
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.globalAlpha = alpha;
                    this.ctx.font = `bold ${Math.round(110 * overshoot)}px monospace`;
                    this.ctx.lineWidth = 14;
                    this.ctx.strokeStyle = '#000';
                    this.ctx.strokeText(text, this.canvas.width / 2, this.canvas.height / 2);
                    this.ctx.fillStyle = fillColor;
                    this.ctx.fillText(text, this.canvas.width / 2, this.canvas.height / 2);
                    this.ctx.restore();
                }

                if (this.roundIntro.active) this.drawRoundIntro();
            }

            drawRoundIntro() {
                const t = this.roundIntro.timer;
                const cx = this.canvas.width / 2;
                const cy = this.canvas.height / 2;

                this.ctx.save();
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';

                if (t < 45) {
                    // Dark overlay fades in
                    const overlayAlpha = Math.min(0.45, (t / 15) * 0.45);
                    this.ctx.fillStyle = `rgba(0, 0, 0, ${overlayAlpha})`;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    // "GET READY!" slides in from above
                    const textAlpha = Math.min(1, t / 10);
                    const offsetY = Math.max(0, (1 - t / 10)) * -60;
                    this.ctx.globalAlpha = textAlpha;
                    const scale = 0.8 + 0.2 * Math.min(1, t / 10);
                    this.ctx.font = `bold ${Math.round(54 * scale)}px monospace`;
                    this.ctx.lineWidth = 8;
                    this.ctx.strokeStyle = '#000';
                    this.ctx.strokeText('GET READY!', cx, cy + offsetY);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillText('GET READY!', cx, cy + offsetY);

                    // Enemy level warning — slides up from below after GET READY lands
                    if (this.winStreak > 0) {
                        const lvl = this.winStreak + 1;
                        const lvlFade = Math.min(1, Math.max(0, (t - 10) / 10));
                        const lvlRise = Math.max(0, (1 - Math.min(1, Math.max(0, (t - 10) / 10)))) * 28;
                        const lvlColor = lvl >= 7 ? '#ff4455' : lvl >= 4 ? '#ff9f43' : '#ffd700';
                        const pulse = 1 + Math.sin(t * 0.32) * 0.055;
                        this.ctx.globalAlpha = lvlFade;
                        this.ctx.font = `bold ${Math.round(30 * scale * pulse)}px monospace`;
                        this.ctx.lineWidth = 5;
                        this.ctx.strokeStyle = '#000';
                        const lvlText = `ENEMY LVL ${lvl}`;
                        this.ctx.strokeText(lvlText, cx, cy + offsetY + 58 + lvlRise);
                        this.ctx.fillStyle = lvlColor;
                        this.ctx.fillText(lvlText, cx, cy + offsetY + 58 + lvlRise);
                    }
                } else {
                    // "FIGHT!" phase
                    const fightT = t - 45;

                    // Dark overlay fades out
                    const overlayAlpha = 0.45 * Math.max(0, 1 - fightT / 18);
                    if (overlayAlpha > 0) {
                        this.ctx.globalAlpha = 1;
                        this.ctx.fillStyle = `rgba(0, 0, 0, ${overlayAlpha})`;
                        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    }

                    // "FIGHT!" punches in with overshoot scale
                    const alpha = Math.min(1, fightT / 5);
                    const overshoot = fightT < 7 ? 1 + (1 - fightT / 7) * 0.55 : 1.0;
                    this.ctx.globalAlpha = alpha;
                    this.ctx.font = `bold ${Math.round(88 * overshoot)}px monospace`;
                    this.ctx.lineWidth = 11;
                    this.ctx.strokeStyle = '#000';
                    this.ctx.strokeText('FIGHT!', cx, cy);
                    this.ctx.fillStyle = '#ffd700';
                    this.ctx.fillText('FIGHT!', cx, cy);
                }

                this.ctx.restore();
            }

            endGame(winner) {
                this.gameRunning = false;
                this.sounds.stopBackgroundMusic();
                const gameOverDiv = document.getElementById('gameOver');
                const gameOverText = document.getElementById('gameOverText');
                const streakInfo = document.getElementById('streakInfo');
                let isNewRecord = false;

                if (winner === 'player') {
                    this.winStreak++;
                    if (this.winStreak > this.bestStreak) {
                        this.bestStreak = this.winStreak;
                        localStorage.setItem('bestStreak', this.bestStreak);
                        isNewRecord = true;
                    }
                    localStorage.setItem('winStreak', this.winStreak);

                    if (!this.tookDamage) {
                        this.addScore(500);
                    }
                    const isNewScoreRecord = this.score > this.prevBestScore && this.score > 0;

                    gameOverText.innerHTML = '🎉 You Won! 🎉<br>The computer gave up from the stench!';
                    let streakMsg = `Win Streak: <strong>${this.winStreak}</strong>`;
                    if (isNewRecord && this.winStreak > 1) {
                        streakMsg += '<br><strong style="color:#e67e22;font-size:20px">★ NEW RECORD! ★</strong>';
                    }
                    if (this.bestCombo >= 2) {
                        streakMsg += `<br><span style="font-size:15px;color:#e67e22;">Best combo: <strong>x${this.bestCombo}</strong></span>`;
                    }
                    if (!this.tookDamage) {
                        streakMsg += '<br><strong style="color:#e056fd;font-size:19px">★ PERFECT ROUND! ★</strong>';
                        this.perfectTimer = 50;
                    }
                    streakMsg += `<br><span style="font-size:15px;">Score: <strong style="color:#2980b9">${this.score}</strong></span>`;
                    if (isNewScoreRecord) {
                        streakMsg += '<br><strong style="color:#2980b9;font-size:17px">★ NEW HIGH SCORE! ★</strong>';
                    }
                    streakInfo.innerHTML = streakMsg;

                    // Confetti celebration: flash + burst, delay modal so the moment lands
                    this.celebrating = true;
                    this.koTextTimer = 44;
                    this.koWinner = 'player';
                    this.killFlashTimer = 12;
                    this.koCharacter = this.ai;
                    this.koAngle = 0;
                    this.koDustSpawned = false;
                    this.spawnConfetti(this.ai.x + this.ai.width / 2, this.ai.y + this.ai.height / 2);

                    if (isNewRecord && this.bestStreak > 1) {
                        this.sounds.playRecordBreaker();
                    } else {
                        this.sounds.playVictoryFanfare();
                    }
                    if (!this.tookDamage) setTimeout(() => this.sounds.playPerfect(), 180);

                    this.updateStreakDisplay();
                    setTimeout(() => {
                        this.celebrating = false;
                        gameOverDiv.classList.remove('new-record-flash');
                        gameOverDiv.style.display = 'block';
                        if (isNewRecord && this.bestStreak > 1) {
                            void gameOverDiv.offsetWidth;
                            gameOverDiv.classList.add('new-record-flash');
                        }
                    }, 750);
                } else {
                    gameOverText.innerHTML = '💚 Computer Wins! 💚<br>You were overwhelmed by spinach!';
                    let lossMsg = this.winStreak > 0 ? `Streak ended at: <strong>${this.winStreak}</strong>` : '';
                    if (this.bestCombo >= 2) {
                        lossMsg += (lossMsg ? '<br>' : '') + `<span style="font-size:15px;color:#e67e22;">Best combo: <strong>x${this.bestCombo}</strong></span>`;
                    }
                    if (this.score > 0) {
                        lossMsg += (lossMsg ? '<br>' : '') + `<span style="font-size:15px;">Score: <strong style="color:#2980b9">${this.score}</strong></span>`;
                    }
                    streakInfo.innerHTML = lossMsg;
                    this.winStreak = 0;
                    localStorage.setItem('winStreak', '0');

                    this.updateStreakDisplay();
                    this.celebrating = true;
                    this.koTextTimer = 30;
                    this.koWinner = 'ai';
                    this.koCharacter = this.player;
                    this.koAngle = 0;
                    this.koDustSpawned = false;
                    this.sounds.playHurl();
                    setTimeout(() => {
                        this.celebrating = false;
                        gameOverDiv.classList.remove('new-record-flash');
                        gameOverDiv.style.display = 'block';
                    }, 500);
                }

                if (window.gameAnalytics) {
                    window.gameAnalytics.trackGameEnd(winner);
                }
            }

            gameLoop() {
                if (this.hitStopFrames > 0) {
                    this.hitStopFrames--;
                } else {
                    this.update();
                }
                this.draw();
                if (this.gameRunning || this.celebrating) {
                    requestAnimationFrame(() => this.gameLoop());
                }
            }
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            new Game();
        }

        // Start the game
        let game = new Game();

        // Enable audio context on first user interaction
        document.addEventListener('click', () => {
            if (game.sounds.context && game.sounds.context.state === 'suspended') {
                game.sounds.context.resume();
            }
        }, { once: true });

        // Simple analytics tracking
        (function() {
            // Track page load time
            if ('performance' in window) {
                window.addEventListener('load', function() {
                    var navigation = performance.getEntriesByType('navigation')[0];
                    if (navigation) {
                        console.log('📊 Page Load Time:', navigation.loadEventEnd - navigation.loadEventStart, 'ms');
                        console.log('📊 DOM Content Loaded:', navigation.domContentLoadedEventEnd - navigation.domContentLoadedEventStart, 'ms');
                    }
                });
            }
            
            console.log('✅ Analytics initialized');
        })();

        // Game analytics tracking
        window.gameAnalytics = {
            trackEvent: (name, data = {}) => {
                if (window.va) {
                    window.va('event', {
                        name,
                        data: {
                            ...data,
                            timestamp: Date.now()
                        }
                    });
                }
            },

            trackGameStart: () => {
                window.gameAnalytics.trackEvent('game_started');
            },

            trackGameEnd: (winner) => {
                window.gameAnalytics.trackEvent('game_ended', { winner });
            },

            trackProjectile: (type) => {
                window.gameAnalytics.trackEvent('projectile_thrown', { type });
            },

            trackHit: (type, target) => {
                window.gameAnalytics.trackEvent('projectile_hit', { type, target });
            }
        };

        // Initialize game analytics
        if (window.gameAnalytics) {
            window.gameAnalytics.trackGameStart();
        }
    </script>
